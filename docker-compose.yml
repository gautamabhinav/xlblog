services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  server:
    build: ./server
    ports:
      - "10000:10000"
    environment:
      NODE_ENV: production
      PORT: 10000
      MONGO_URI: mongodb://mongo:27017/xlblog
      JWT_SECRET: change-me
      JWT_EXPIRY: 7d
      FRONTEND_URL: http://localhost:8080
      PUBLIC_API_URL: http://localhost:10000
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_ENABLED: "true"
      SESSION_STORE: mongo
      CDN_HOST: http://localhost:8080
      VIDEO_EDGE_TTL_SECONDS: 300
    depends_on:
      - mongo
      - redis

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

  edge:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - server

volumes:
  mongo-data:
  redis-data:
