apiVersion: apps/v1
kind: Deployment
metadata:
  name: xlblog-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: xlblog-api
  template:
    metadata:
      labels:
        app: xlblog-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/xlblog-api:latest
          ports:
            - containerPort: 10000
          envFrom:
            - secretRef:
                name: xlblog-api-secrets
          readinessProbe:
            httpGet:
              path: /ping
              port: 10000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 10000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: xlblog-api
spec:
  selector:
    app: xlblog-api
  ports:
    - port: 80
      targetPort: 10000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xlblog-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xlblog-api
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
